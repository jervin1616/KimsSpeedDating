<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kim's Speed Dating backup</title>
<style>
  :root{color-scheme:dark}
  [hidden]{display:none!important}
  body{margin:0;padding:24px 16px;background-color:#1b0203;background-image:radial-gradient(1200px 620px at 50% -10%,#5e0a12 0%,transparent 62%),radial-gradient(circle at 12% 22%,rgba(255,150,170,.7) 0 1px,transparent 2.2px),radial-gradient(circle at 63% 41%,rgba(255,200,170,.55) 0 1.3px,transparent 2.6px),radial-gradient(circle at 81% 12%,rgba(255,110,150,.6) 0 1.1px,transparent 2.3px),radial-gradient(circle at 38% 78%,rgba(255,170,190,.5) 0 1px,transparent 2px);background-size:auto,150px 170px,230px 210px,310px 260px,190px 230px;background-repeat:no-repeat,repeat,repeat,repeat,repeat;min-height:100vh;box-sizing:border-box;color:#f9e8e3;font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
  main{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
  h1{font-size:22px;margin:0}
  p{margin:0;color:#d9a39b}
  button{font:inherit;color:#fff4f2;background:linear-gradient(180deg,#e63a63,#bf0f38);text-shadow:0 1px 0 rgba(90,0,20,.5);border:1px solid #ffd3d9;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer}
  button:disabled{opacity:.5;cursor:not-allowed}
  #msg{color:#f9e8e3;min-height:1.4em}
</style></head><body><main>
  <h1>Download a backup</h1>
  <p>Editors only. This saves every dater, question, match, seat and past stream as one JSON file.</p>
  <div id="gsi"></div>
  <button id="dl" hidden>Download backup</button>
  <button id="signOut" type="button" hidden style="background:#4a0b0f;color:#f9e8e3;border:1px solid #6e1518">Sign out</button>
  <p id="msg" role="status"></p>
</main>
<script src="/db-shim.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  function ready() {
    window.claude.use("user").then(function (u) {
      if (!u) return needSignIn();
      return u.canEdit().then(function (ok) {
        if (!ok) { $("msg").textContent = "This account is not an Editor, so it cannot download backups."; return; }
        $("gsi").textContent = ""; $("dl").hidden = false; $("signOut").hidden = false; $("msg").textContent = "Signed in as " + window.claude.status().email + ".";
      });
    });
  }
  function needSignIn() {
    var st = window.claude.status();
    $("msg").textContent = st.noAccess ? "This Google account (" + st.email + ") is not on the list." : "Sign in with Google to continue.";
    window.claude.signIn($("gsi"), function (r) { if (r.error) $("msg").textContent = r.error; else ready(); });
  }
  $("dl").onclick = function () {
    $("dl").disabled = true; $("msg").textContent = "Preparing the file...";
    window.claude.authFetch("/api/export").then(function (r) {
      if (!r.ok) throw new Error("The server said no (" + r.status + ").");
      return r.blob();
    }).then(function (b) {
      var a = document.createElement("a"); a.href = URL.createObjectURL(b);
      a.download = "speed-dating-backup-" + new Date().toISOString().slice(0, 10) + ".json";
      document.body.appendChild(a); a.click(); a.remove();
      $("msg").textContent = "Done. Keep the file somewhere private: it contains your daters' names.";
    }).catch(function (e) { $("msg").textContent = "Download failed: " + e.message; }).then(function () { $("dl").disabled = false; });
  };
  $("signOut").onclick = function () { if (window.confirm("Sign out on this device?")) { window.claude.signOut(); location.reload(); } };
  ready();
})();
</script></body></html>
